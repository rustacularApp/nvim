# Change Name here
name: {Custom Name}
on:
  push:
    branches: [ master ]
    paths:
      - 'backend/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Github Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Custom Docker image final version
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Change name here.
          tags: ghcr.io/rustacularapp/{app-name-backend:latest}
  deploy:
      needs: build-and-push
      runs-on: ubuntu-latest
      steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy docker-compose.yml to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.PORT }}
          source: "docker-compose.yml"
          target: "~/backend/"

      - name: Deploy to Centabo VPS
        uses: appleboy/ssh-action@v1.2.5
        env:
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_NAME: ${{ secrets.ADMIN_NAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          APPLICATION_SCHEMA: ${{ secrets.APPLICATION_SCHEMA }}
          APPLICATION_SHA256: ${{ secrets.APPLICATION_SHA256 }}
          APPLICATION_SHA256_DEV: ${{ secrets.APPLICATION_SHA256_DEV }}
          BASE_NATIVE_URL: ${{ secrets.BASE_NATIVE_URL }}
          BASE_WEB_URL: ${{ secrets.BASE_WEB_URL }}
          DEVELOPMENT_ANDROID_ORIGIN_KEY_HASH: ${{ secrets.DEVELOPMENT_ANDROID_ORIGIN_KEY_HASH }}
          DEVELOPMENT_ANDROID_ORIGIN_KEY_HASH_CLIENT: ${{ secrets.DEVELOPMENT_ANDROID_ORIGIN_KEY_HASH_CLIENT }}
          DEVELOPMENT_ANDROID_ORIGIN_KEY_HASH_CLIENT_NEW: ${{ secrets.DEVELOPMENT_ANDROID_ORIGIN_KEY_HASH_CLIENT_NEW }}
          DEVELOPMENT_ANDROID_ORIGIN_KEY_HASH_DEV: ${{ secrets.DEVELOPMENT_ANDROID_ORIGIN_KEY_HASH_DEV }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_ENCODING_PRIVATE_KEY: ${{ secrets.FIREBASE_ENCODING_PRIVATE_KEY }}
          FIREBASE_GRANT_TYPE: ${{ secrets.FIREBASE_GRANT_TYPE }}
          FIREBASE_POST_URI: ${{ secrets.FIREBASE_POST_URI }}
          FIREBASE_SCOPE: ${{ secrets.FIREBASE_SCOPE }}
          FIREBASE_TOKEN_EXPIRY: ${{ secrets.FIREBASE_TOKEN_EXPIRY }}
          FIREBASE_TOKEN_URI: ${{ secrets.FIREBASE_TOKEN_URI }}
          GOOGLE_OAUTH_ANDROID_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_ANDROID_CLIENT_ID }}
          GOOGLE_OAUTH_AUTH_URL: ${{ secrets.GOOGLE_OAUTH_AUTH_URL }}
          GOOGLE_OAUTH_CERTS: ${{ secrets.GOOGLE_OAUTH_CERTS }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REDIRECT_URL: ${{ secrets.GOOGLE_OAUTH_REDIRECT_URL }}
          GOOGLE_OAUTH_TOKEN_REDIRECT_URL: ${{ secrets.GOOGLE_OAUTH_TOKEN_REDIRECT_URL }}
          GOOGLE_OAUTH_TOKEN_URL: ${{ secrets.GOOGLE_OAUTH_TOKEN_URL }}
          GOOGLE_OAUTH_WEB_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_WEB_CLIENT_ID }}
          IS_VPS: ${{ secrets.IS_VPS }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          OAUTH_JWT_EXPIRATION_DURATION_IN_HOURS: ${{ secrets.OAUTH_JWT_EXPIRATION_DURATION_IN_HOURS }}
          OAUTH_REFRESH_JWT_EXPIRATION_DURATION_IN_DAYS: ${{ secrets.OAUTH_REFRESH_JWT_EXPIRATION_DURATION_IN_DAYS }}
          POSTGRES_DATABASE: ${{ secrets.POSTGRES_DATABASE }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          REDIS_PORT: ${{ secrets.REDIS_PORT }}
          REDIS_HOST: ${{ secrets.REDIS_HOST }}
          POSTGRES_USERNAME: ${{ secrets.POSTGRES_USERNAME }}
          RUST_LOG: ${{ secrets.RUST_LOG }}
          RP_ID: ${{ secrets.RP_ID }}
          RP_ORIGIN: ${{ secrets.RP_ORIGIN }}
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_PROVIDER: ${{ secrets.SMTP_PROVIDER }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.PORT }}
          envs: >
            PERSONAL_ACCESS_TOKEN,
            ADMIN_EMAIL,
            ADMIN_NAME,
            ADMIN_PASSWORD,
            APPLICATION_SCHEMA,
            APPLICATION_SHA256,
            APPLICATION_SHA256_DEV,
            BASE_NATIVE_URL,
            BASE_WEB_URL,
            DEVELOPMENT_ANDROID_ORIGIN_KEY_HASH,
            DEVELOPMENT_ANDROID_ORIGIN_KEY_HASH_CLIENT,
            DEVELOPMENT_ANDROID_ORIGIN_KEY_HASH_CLIENT_NEW,
            DEVELOPMENT_ANDROID_ORIGIN_KEY_HASH_DEV,
            FIREBASE_CLIENT_EMAIL,
            FIREBASE_ENCODING_PRIVATE_KEY,
            FIREBASE_GRANT_TYPE,
            FIREBASE_POST_URI,
            FIREBASE_SCOPE,
            FIREBASE_TOKEN_EXPIRY,
            FIREBASE_TOKEN_URI,
            GOOGLE_OAUTH_ANDROID_CLIENT_ID,
            GOOGLE_OAUTH_AUTH_URL,
            GOOGLE_OAUTH_CERTS,
            GOOGLE_OAUTH_CLIENT_SECRET,
            GOOGLE_OAUTH_REDIRECT_URL,
            GOOGLE_OAUTH_TOKEN_REDIRECT_URL,
            GOOGLE_OAUTH_TOKEN_URL,
            GOOGLE_OAUTH_WEB_CLIENT_ID,
            IS_VPS,
            JWT_SECRET,
            OAUTH_JWT_EXPIRATION_DURATION_IN_HOURS,
            OAUTH_REFRESH_JWT_EXPIRATION_DURATION_IN_DAYS,
            POSTGRES_DATABASE,
            POSTGRES_PASSWORD,
            POSTGRES_PORT,
            POSTGRES_USERNAME,
            REDIS_PORT,
            REDIS_PASSWORD,
            REDIS_HOST,
            RUST_LOG,
            RP_ID,
            RP_ORIGIN,
            SMTP_EMAIL,
            SMTP_PASSWORD,
            SMTP_PROVIDER,
          script: |
            # Ensure path to docker is loaded
            export PATH=$PATH:/usr/bin:/usr/local/bin:/usr/libexec/docker/cli-plugins

            cd ~/backend/

            echo $PERSONAL_ACCESS_TOKEN | docker login ghcr.io -u rustacularapp --password-stdin

            ADMIN_EMAIL=$ADMIN_EMAIL \
            ADMIN_NAME=$ADMIN_NAME \
            ADMIN_PASSWORD=$ADMIN_PASSWORD \
            APPLICATION_SCHEMA=$APPLICATION_SCHEMA \
            APPLICATION_SHA256=$APPLICATION_SHA256 \
            APPLICATION_SHA256_DEV=$APPLICATION_SHA256_DEV \
            BASE_NATIVE_URL=$BASE_NATIVE_URL \
            BASE_WEB_URL=$BASE_WEB_URL \
            DEVELOPMENT_ANDROID_ORIGIN_KEY_HASH=$DEVELOPMENT_ANDROID_ORIGIN_KEY_HASH \
            DEVELOPMENT_ANDROID_ORIGIN_KEY_HASH_CLIENT=$DEVELOPMENT_ANDROID_ORIGIN_KEY_HASH_CLIENT \
            DEVELOPMENT_ANDROID_ORIGIN_KEY_HASH_CLIENT_NEW=$DEVELOPMENT_ANDROID_ORIGIN_KEY_HASH_CLIENT_NEW \
            DEVELOPMENT_ANDROID_ORIGIN_KEY_HASH_DEV=$DEVELOPMENT_ANDROID_ORIGIN_KEY_HASH_DEV \
            FIREBASE_CLIENT_EMAIL=$FIREBASE_CLIENT_EMAIL \
            FIREBASE_ENCODING_PRIVATE_KEY=$FIREBASE_ENCODING_PRIVATE_KEY \
            FIREBASE_GRANT_TYPE=$FIREBASE_GRANT_TYPE \
            FIREBASE_POST_URI=$FIREBASE_POST_URI \
            FIREBASE_SCOPE=$FIREBASE_SCOPE \
            FIREBASE_TOKEN_EXPIRY=$FIREBASE_TOKEN_EXPIRY \
            FIREBASE_TOKEN_URI=$FIREBASE_TOKEN_URI \
            GOOGLE_OAUTH_ANDROID_CLIENT_ID=$GOOGLE_OAUTH_ANDROID_CLIENT_ID \
            GOOGLE_OAUTH_AUTH_URL=$GOOGLE_OAUTH_AUTH_URL \
            GOOGLE_OAUTH_CERTS=$GOOGLE_OAUTH_CERTS \
            GOOGLE_OAUTH_CLIENT_SECRET=$GOOGLE_OAUTH_CLIENT_SECRET \
            GOOGLE_OAUTH_REDIRECT_URL=$GOOGLE_OAUTH_REDIRECT_URL \
            GOOGLE_OAUTH_TOKEN_REDIRECT_URL=$GOOGLE_OAUTH_TOKEN_REDIRECT_URL \
            GOOGLE_OAUTH_TOKEN_URL=$GOOGLE_OAUTH_TOKEN_URL \
            GOOGLE_OAUTH_WEB_CLIENT_ID=$GOOGLE_OAUTH_WEB_CLIENT_ID \
            IS_VPS=$IS_VPS \
            JWT_SECRET=$JWT_SECRET \
            OAUTH_JWT_EXPIRATION_DURATION_IN_HOURS=$OAUTH_JWT_EXPIRATION_DURATION_IN_HOURS \
            OAUTH_REFRESH_JWT_EXPIRATION_DURATION_IN_DAYS=$OAUTH_REFRESH_JWT_EXPIRATION_DURATION_IN_DAYS \
            POSTGRES_DATABASE=$POSTGRES_DATABASE \
            POSTGRES_PASSWORD=$POSTGRES_PASSWORD \
            POSTGRES_PORT=$POSTGRES_PORT \
            POSTGRES_USERNAME=$POSTGRES_USERNAME \
            REDIS_PASSWORD=$REDIS_PASSWORD \
            REDIS_PORT=$REDIS_PORT \
            REDIS_HOST=$REDIS_HOST \
            RUST_LOG=$RUST_LOG \
            RP_ID=$RP_ID \
            RP_ORIGIN=$RP_ORIGIN \
            SMTP_EMAIL=$SMTP_EMAIL \
            SMTP_PASSWORD=$SMTP_PASSWORD \
            SMTP_PROVIDER=$SMTP_PROVIDER \
            docker compose up -d --pull always
